appId: com.snipwise.app
productName: Snipwise
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,README.md}'
  - '!{.env,.env.*,.npmrc}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,components.json}'
asarUnpack:
  - resources/**
mac:
  target:
    - target: dmg
      arch: arm64
  entitlementsInherit: build/entitlements.mac.plist
  # signing + notarization get set up in m6, see spec section 12
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
